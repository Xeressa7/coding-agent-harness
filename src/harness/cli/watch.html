<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness canlı panel</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #eef0f4; --text: #1c2030;
    --muted: #5d6475; --border: #d9dde5; --accent: #3f5bd8; --ok: #1f8a4c;
    --warn: #a36a00; --err: #c23b3b; --harness: #7a3fc4; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c; --surface: #1c1f27; --surface-2: #252935; --text: #e4e7ef;
      --muted: #9aa1b2; --border: #323746; --accent: #8ea2ff; --ok: #5cc98a;
      --warn: #e0a83a; --err: #f07878; --harness: #c39bff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --surface: #1c1f27; --surface-2: #252935; --text: #e4e7ef;
    --muted: #9aa1b2; --border: #323746; --accent: #8ea2ff; --ok: #5cc98a;
    --warn: #e0a83a; --err: #f07878; --harness: #c39bff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* display: flex kuralları hidden özniteliğini ezmesin */
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--surface);
           border-bottom: 1px solid var(--border); padding: 10px 16px;
           display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - var(--head, 50px)); }
  aside { border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; max-height: calc(100vh - var(--head, 50px)); position: sticky; top: var(--head, 50px); }
  aside label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .log { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none;
         color: var(--text); padding: 7px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
  .log:hover { background: var(--surface-2); }
  .log.on { border-color: var(--accent); background: var(--surface); }
  .log small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  main { padding: 16px; max-width: 980px; width: 100%; min-width: 0; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .turn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .turn > .head { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .turn > .head .task { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 12px; }
  .step { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .step:last-child { border-bottom: 0; }
  .step-title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
  .step-title strong { color: var(--accent); }
  .thinking { color: var(--muted); font-style: italic; white-space: pre-wrap; margin: 6px 0; font-size: 13px; overflow-wrap: anywhere; }
  .answer { white-space: pre-wrap; margin: 6px 0; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 13px; flex-wrap: wrap; }
  .row > span:not(.tag) { min-width: 0; overflow-wrap: anywhere; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .tag.ok { color: var(--ok); } .tag.err { color: var(--err); } .tag.wait { color: var(--warn); }
  .tag.harness { color: var(--harness); }
  .harness-row { border-left: 3px solid var(--harness); padding-left: 8px; }
  details { margin: 4px 0; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre { font: 12px/1.45 var(--mono); background: var(--surface-2); padding: 8px; border-radius: 6px;
        white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow: auto; margin: 4px 0; }
  .finish { padding: 8px 14px; font-size: 13px; background: var(--surface-2); }
  .spinner::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: 1px solid var(--border); background: none; color: var(--muted); border-radius: 6px;
                 padding: 3px 12px; font: inherit; cursor: pointer; }
  .tabs button.on { color: var(--text); background: var(--surface-2); border-color: var(--accent); }
  /* ---- akış defteri (watch_ledger.js) ---- */
  .lg-view { display: flex; flex-direction: column; height: calc(100vh - var(--head, 50px)); min-width: 0; }
  .lg-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px;
              border-bottom: 1px solid var(--border); background: var(--surface); }
  .lg-status { font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px;
               background: var(--surface-2); white-space: nowrap; }
  .lg-status.s-done { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .lg-status.s-step_limit, .lg-status.s-cancelled { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .lg-status.s-error { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
  .lg-status.s-running { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .lg-what { min-width: 0; flex: 1 1 320px; }
  .lg-task { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .lg-facts b { color: var(--text); font-size: 14px; font-variant-numeric: tabular-nums; }
  .lg-facts .warn b { color: var(--warn); } .lg-facts .harness b { color: var(--harness); }
  .lg-layers { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }
  .lg-error { width: 100%; color: var(--err); font-size: 12px; white-space: pre-wrap; }
  .chip { font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted);
          white-space: nowrap; margin-left: 4px; }
  .chip.harness { color: var(--harness); background: color-mix(in srgb, var(--harness) 14%, transparent); }
  .chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .lg-overview { padding: 8px 16px 4px; border-bottom: 1px solid var(--border); user-select: none; }
  .lg-ov { display: block; width: 100%; cursor: crosshair; }
  .ov-lane { stroke: var(--border); stroke-width: 1; }
  .ov-label { fill: var(--muted); font: 11px system-ui, sans-serif; }
  .ov-wait { fill: color-mix(in srgb, var(--accent) 30%, transparent); }
  .ov-gen { fill: var(--accent); }
  .ov-tool { fill: var(--muted); } .ov-tool.err { fill: var(--err); }
  .ov-tool.k-read { fill: var(--accent); } .ov-tool.k-write { fill: var(--ok); } .ov-tool.k-edit { fill: var(--warn); }
  .ov-tool.k-delete { fill: var(--err); } .ov-tool.k-search { fill: var(--harness); } .ov-tool.k-bash, .ov-tool.k-net { fill: var(--text); }
  .ov-harness { fill: var(--harness); }
  .ov-ctx { fill: color-mix(in srgb, var(--text) 30%, transparent); } .ov-ctx.cut { fill: var(--err); }
  .lg-ov rect { cursor: pointer; } .lg-ov rect.sel { stroke: var(--text); stroke-width: 1.5; }
  .ov-finish { stroke: var(--ok); stroke-width: 2; } .ov-finish.s-step_limit, .ov-finish.s-cancelled { stroke: var(--warn); }
  .ov-finish.s-error { stroke: var(--err); }
  .ov-gap { stroke: var(--muted); stroke-dasharray: 2 3; }
  .ov-band { fill: color-mix(in srgb, var(--accent) 12%, transparent); stroke: var(--accent); pointer-events: none; }
  .lg-scale { display: flex; gap: 12px; align-items: center; font: 11px var(--mono); color: var(--muted); padding-left: 64px; }
  .lg-scale > :last-child { margin-left: auto; }
  .lg-legend { display: inline-flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; font-family: system-ui, sans-serif; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .sw.ov-wait { background: color-mix(in srgb, var(--accent) 30%, transparent); } .sw.ov-gen { background: var(--accent); }
  .sw.ov-ctx { background: color-mix(in srgb, var(--text) 30%, transparent); } .sw.ov-ctx.cut { background: var(--err); }
  .lg-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 40%); min-height: 0; }
  .lg-ledger { overflow: auto; padding: 0 0 24px; }
  .lg-ledger:focus { outline: none; }
  .lg-turn { padding: 10px 16px 6px; font-size: 13px; position: sticky; top: 0; background: var(--bg); z-index: 1;
             border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-step { padding: 10px 16px 4px; font-size: 12px; color: var(--muted); }
  .lg-step b { color: var(--accent); font-size: 13px; }
  .lg-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto 64px; gap: 10px; align-items: center;
            padding: 5px 16px; font-size: 13px; cursor: pointer; border-left: 3px solid transparent; }
  .lg-row:hover { background: var(--surface-2); }
  .lg-row.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); border-left-color: var(--accent); }
  .lg-row.t-harness { border-left-color: var(--harness); }
  .lg-row.t-harness.sel { border-left-color: var(--accent); }
  .lg-c.kind { display: flex; justify-content: flex-start; }
  .lg-c.what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-c.res { display: flex; align-items: center; gap: 4px; justify-content: flex-end; white-space: nowrap; font-size: 12px; color: var(--muted); }
  .lg-c.time { text-align: right; font: 12px var(--mono); color: var(--muted); }
  .lg-name { font-family: var(--mono); font-size: 12px; }
  .lg-who { font-size: 11px; color: var(--accent); } .lg-who.harness { color: var(--harness); }
  .lg-think { color: var(--muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; }
  .lg-say { overflow: hidden; text-overflow: ellipsis; }
  .lg-finish { margin: 8px 16px; padding: 8px 12px; border-radius: 8px; font-size: 13px; background: var(--surface-2); }
  .lg-finish.s-done b { color: var(--ok); } .lg-finish.s-step_limit b, .lg-finish.s-cancelled b { color: var(--warn); }
  .lg-finish.s-error b { color: var(--err); }
  .lg-inspector { border-left: 1px solid var(--border); overflow: auto; padding: 12px 14px; font-size: 13px; background: var(--surface); }
  .lg-inspector h3 { font-size: 14px; margin: 0 0 8px; overflow-wrap: anywhere; }
  .lg-note { font-size: 12px; padding: 4px 8px; margin-bottom: 6px; border-left: 3px solid var(--harness); background: var(--surface-2); }
  .lg-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px; }
  .lg-tabs button { border: 1px solid var(--border); background: none; color: var(--muted); border-radius: 6px;
                    padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .lg-tabs button.on { color: var(--text); background: var(--surface-2); border-color: var(--accent); }
  .lg-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0 0 10px; font-size: 12px; }
  .lg-kv dt { color: var(--muted); } .lg-kv dd { margin: 0; overflow-wrap: anywhere; }
  .lg-msg { border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; margin: 6px 0; }
  .lg-msg.new { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .lg-msg summary { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .role { font: 11px var(--mono); padding: 0 6px; border-radius: 4px; background: var(--surface-2); }
  .role.r-system { color: var(--ok); } .role.r-user { color: var(--accent); } .role.r-tool { color: var(--warn); }
  .role.r-assistant { color: var(--harness); }
  .lg-diff { font: 12px/1.5 var(--mono); border: 1px solid var(--border); border-radius: 6px; overflow: auto; max-height: 70vh; }
  .lg-diff > div { display: grid; grid-template-columns: 40px 14px minmax(0, 1fr); white-space: pre-wrap; overflow-wrap: anywhere; }
  .lg-diff .ln { color: var(--muted); text-align: right; padding-right: 6px; user-select: none; }
  .lg-diff .sg { color: var(--muted); user-select: none; }
  .lg-diff .add { background: color-mix(in srgb, var(--ok) 16%, transparent); }
  .lg-diff .del { background: color-mix(in srgb, var(--err) 16%, transparent); }
  .lg-diff .add .sg { color: var(--ok); } .lg-diff .del .sg { color: var(--err); }
  @media (max-width: 900px) {
    .lg-view { height: auto; }
    .lg-body { grid-template-columns: minmax(0, 1fr); }
    .lg-ledger { max-height: 60vh; }
    .lg-inspector { border-left: 0; border-top: 1px solid var(--border); }
    .lg-row { grid-template-columns: 50px minmax(0, 1fr) 56px; }
    .lg-c.res { display: none; }
  }
  /* ---- ortak işaretler (defter ve dosyalar) ---- */
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); display: inline-block; }
  .k-read { background: var(--accent); } .k-edit { background: var(--warn); } .k-write { background: var(--ok); }
  .k-delete { background: var(--err); } .k-search, .k-hit { background: var(--harness); }
  .k-list { background: color-mix(in srgb, var(--accent) 45%, var(--muted)); }
  .k-bash, .k-net { background: var(--text); } .k-plan, .k-other, .k-none { background: var(--muted); }
  .meta.ok { color: var(--ok); } .meta.err { color: var(--err); }
  .linklike { border: 0; background: none; color: var(--accent); padding: 0; font: inherit; cursor: pointer; }
  /* ---- dosyalar görünümü (watch_files.js) ---- */
  .fl-view { display: flex; flex-direction: column; height: calc(100vh - var(--head, 50px)); min-width: 0; }
  .fl-head { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .fl-sentence { font-size: 14px; margin-bottom: 6px; }
  .fl-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); align-items: center; }
  .fl-key { display: inline-flex; align-items: center; gap: 4px; }
  .fl-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 32%); min-height: 0; }
  .fl-grid { display: grid; align-content: start; overflow: auto; padding: 8px 16px 24px; row-gap: 2px; position: relative; }
  .fl-corner { font-size: 11px; color: var(--muted); padding: 4px 6px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .fl-step { font: 11px var(--mono); color: var(--muted); text-align: center; padding: 4px 0; position: sticky; top: 0;
             background: var(--bg); z-index: 2; cursor: help; }
  .fl-subhead { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; justify-content: space-between; }
  .fl-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .fl-toggle { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  .fl-btn { border: 1px solid var(--border); background: none; color: var(--muted); border-radius: 6px;
            padding: 2px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .fl-btn:hover { color: var(--text); border-color: var(--accent); }
  /* ağaç satırları */
  .fl-file.dir { font-weight: 600; }
  .fl-file.root .fl-name { color: var(--accent); }
  .fl-caret { display: inline-block; width: 14px; color: var(--muted); font-size: 11px; }
  .fl-file.leaf .fl-name { font-weight: 400; }
  .fl-cell.dir { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
  .fl-empty.dir { background: color-mix(in srgb, var(--surface-2) 25%, transparent); }
  /* geçiş okları */
  .fl-trail { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }
  .fl-jump { fill: none; stroke: var(--accent); stroke-width: 1.4; opacity: .45; }
  .fl-jump.in { stroke: var(--warn); stroke-width: 2.4; opacity: 1; }
  .fl-jump.out { stroke: var(--ok); stroke-width: 2.4; opacity: 1; }
  .fl-jump.dim { opacity: .1; }
  .fl-group { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 3; opacity: .8; }
  .fl-group.dim { opacity: .15; }
  .fl-group-key { display: inline-block; width: 2px; height: 14px; border-left: 1.5px dashed var(--muted); vertical-align: middle; }
  .fl-arrowhead { fill: var(--accent); } .fl-arrowhead.in { fill: var(--warn); } .fl-arrowhead.out { fill: var(--ok); }
  .fl-arrow-key { display: inline-block; width: 18px; height: 2px; background: var(--accent); position: relative; opacity: .7; }
  .fl-arrow-key::after { content: ""; position: absolute; right: -2px; top: -3px; border: 4px solid transparent;
                         border-left: 5px solid var(--accent); border-right: 0; }
  /* ---- üst sağ: düzen haritası ve tema ---- */
  .hud { display: flex; gap: 10px; align-items: center; margin-left: auto; }
  .layout-map { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--border); border-radius: 9px;
                background: var(--bg); }
  .lm { border: 1px solid var(--border); background: var(--surface-2); border-radius: 5px; height: 24px; padding: 0;
        cursor: pointer; display: grid; place-items: center; color: var(--muted);
        transition: background .2s, border-color .2s, opacity .2s, transform .15s; }
  .lm:hover { border-color: var(--accent); transform: translateY(-1px); }
  .lm-side { width: 22px; }
  .lm-mid { width: 64px; font-size: 11px; letter-spacing: .02em; }
  .lm-lines { display: grid; gap: 3px; }
  .lm-lines i { display: block; width: 10px; height: 2px; border-radius: 1px; background: currentColor; }
  .lm[aria-pressed="true"].lm-side { background: color-mix(in srgb, var(--accent) 22%, var(--surface-2)); color: var(--accent);
                                     border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
  .lm[aria-pressed="false"].lm-side { background: transparent; border-style: dashed; opacity: .7; }
  .lm-mid[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .theme-wrap { position: relative; }
  .theme-btn { display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--border); background: var(--surface-2);
               color: var(--text); border-radius: 999px; padding: 3px 11px 3px 4px; font: inherit; font-size: 12px; cursor: pointer; }
  .theme-btn:hover { border-color: var(--accent); }
  .theme-orb { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 25%, transparent);
               background: conic-gradient(var(--accent) 0 25%, var(--ok) 0 50%, var(--warn) 0 75%, var(--harness) 0); }
  .theme-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(520px, calc(100vw - 32px));
               background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
               box-shadow: 0 18px 50px rgb(0 0 0 / .35); display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .theme-card { border: 1px solid var(--border); border-radius: 10px; padding: 0; overflow: hidden; cursor: pointer; text-align: left;
                background: none; color: var(--text); font: inherit; transition: transform .15s, border-color .15s; }
  .theme-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .theme-card.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .theme-prev { height: 58px; padding: 8px; display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
  .theme-prev .tp-rail { border-radius: 4px; }
  .theme-prev .tp-body { border-radius: 4px; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
  .theme-prev .tp-line { height: 4px; border-radius: 2px; }
  .theme-prev .tp-dots { display: flex; gap: 4px; margin-top: auto; }
  .theme-prev .tp-dots i { width: 9px; height: 9px; border-radius: 2px; }
  .theme-meta { padding: 6px 9px 8px; border-top: 1px solid var(--border); }
  .theme-meta b { display: block; font-size: 13px; }
  .theme-meta span { font-size: 11px; color: var(--muted); }
  body { transition: background-color .35s, color .35s; }

  /* ---- kapanan paneller ince şerit olur: dikey adıyla kalır, tıklayınca açılır ---- */
  .layout, .fl-body, .lg-body { transition: grid-template-columns .28s cubic-bezier(.2, .8, .2, 1); }
  body.hide-sessions .layout { grid-template-columns: 30px minmax(0, 1fr); }
  body.hide-side .fl-body, body.hide-side .lg-body { grid-template-columns: minmax(0, 1fr) 30px; }
  body.hide-sessions .layout > aside, body.hide-side .fl-side, body.hide-side .lg-inspector {
    padding: 0; overflow: hidden; cursor: pointer; position: relative; background: var(--surface);
    display: flex; align-items: flex-start; justify-content: center; }
  body.hide-sessions .layout > aside > *, body.hide-side .fl-side > *, body.hide-side .lg-inspector > * { display: none; }
  body.hide-sessions .layout > aside::after, body.hide-side .fl-side::after, body.hide-side .lg-inspector::after {
    writing-mode: vertical-rl; font-size: 12px; letter-spacing: .08em; color: var(--muted); padding: 14px 0;
    transition: color .2s; }
  body.hide-sessions .layout > aside::after { content: "› OTURUMLAR " attr(data-count); transform: rotate(180deg); }
  body.hide-side .fl-side::after, body.hide-side .lg-inspector::after { content: "‹ AYRINTI"; }
  body.hide-sessions .layout > aside:hover::after, body.hide-side .fl-side:hover::after,
  body.hide-side .lg-inspector:hover::after { color: var(--accent); }
  body.hide-sessions .layout > aside:hover, body.hide-side .fl-side:hover, body.hide-side .lg-inspector:hover {
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
  .fl-step.fl-turn { border-left: 2px solid var(--border); }
  .fl-lane { font-size: 12px; color: var(--muted); padding: 3px 6px; font-style: italic; }
  .fl-file { font-size: 13px; padding: 3px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; border-radius: 4px; }
  .fl-file:hover { background: var(--surface-2); }
  .fl-file.changed .fl-name { color: var(--warn); font-weight: 600; }
  .fl-dir { color: var(--muted); }
  .fl-cell { border: 0; background: var(--surface-2); border-radius: 4px; height: 24px; padding: 0; cursor: pointer;
             display: flex; align-items: center; justify-content: center; }
  .fl-cell:hover { outline: 1px solid var(--accent); }
  .fl-cell.sel { outline: 2px solid var(--text); }
  .fl-empty { height: 24px; border-radius: 4px; background: color-mix(in srgb, var(--surface-2) 40%, transparent); }
  .fl-marks { display: inline-flex; gap: 1px; }
  .fl-mark { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 2px;
             border-radius: 3px; font: 700 11px var(--mono); color: var(--bg); }
  .fl-mark.k-hit { background: transparent; color: var(--harness); font-size: 16px; }
  .fl-mark.k-search { background: var(--harness); }
  .fl-mark.failed { background: transparent; color: var(--err); outline: 1px solid var(--err); }
  .fl-sum { font-size: 11px; color: var(--muted); padding: 3px 8px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .fl-mark sup { font-size: 8px; margin-left: 1px; }
  .fl-count { display: inline-flex; align-items: center; gap: 2px; }
  .fl-cover { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .fl-cover i { display: block; height: 100%; background: var(--accent); }
  .fl-side { border-left: 1px solid var(--border); overflow: auto; padding: 12px 14px; font-size: 13px; background: var(--surface); }
  .fl-side h3 { font-size: 14px; margin: 0 0 8px; overflow-wrap: anywhere; }
  .fl-side p { color: var(--muted); margin: 0 0 10px; }
  .fl-label { font-size: 12px; color: var(--accent); margin: 10px 0 4px; overflow-wrap: anywhere; }
  .fl-reason { color: var(--text) !important; font-style: italic; }
  .fl-rec { border-top: 1px solid var(--border); padding-top: 6px; margin-top: 8px; }
  .fl-visit { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text); padding: 4px; border-radius: 4px; font: inherit; cursor: pointer; }
  .fl-visit:hover { background: var(--surface-2); }
  @media (max-width: 900px) {
    .fl-view { height: auto; }
    .fl-body { grid-template-columns: minmax(0, 1fr); }
    .fl-grid { max-height: 60vh; }
    .fl-side { border-left: 0; border-top: 1px solid var(--border); }
  }
  @media (max-width: 760px) {
    .layout, body.hide-sessions .layout { grid-template-columns: minmax(0, 1fr); }
    body.hide-sessions .layout > aside::after { writing-mode: horizontal-tb; transform: none; padding: 8px 0; }
    .hud { margin-left: 0; }
    header { position: static; }
    aside { position: static; max-height: 220px; border-right: 0; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span>Harness canlı panel</h1>
  <nav class="tabs"><button id="tab-flow" class="on">Akış</button><button id="tab-files">Dosyalar</button></nav>
  <div class="stats" id="stats"></div>
  <div class="hud">
    <!-- düzen haritası: sayfanın üç bölümünün küçük resmi; parçaya tıklamak o bölümü açar/kapatır -->
    <div class="layout-map" role="group" aria-label="Düzen">
      <button class="lm lm-side" id="toggle-sessions" title="Oturumlar paneli · [">
        <span class="lm-lines"><i></i><i></i><i></i></span></button>
      <button class="lm lm-mid" id="toggle-focus" title="Odak: iki yanı birden kapat/aç · F">
        <span class="lm-focus">Odak</span></button>
      <button class="lm lm-side" id="toggle-side" title="Ayrıntı paneli · ]">
        <span class="lm-lines"><i></i><i></i><i></i></span></button>
    </div>
    <div class="theme-wrap">
      <button id="theme-btn" class="theme-btn" aria-haspopup="true" aria-expanded="false" title="Renk teması · T">
        <span class="theme-orb"></span><span id="theme-name">Tema</span></button>
      <div class="theme-pop" id="theme-pop" hidden></div>
    </div>
  </div>
</header>
<div class="layout">
  <aside>
    <label><input type="checkbox" id="follow" checked> En yeni kaydı takip et</label>
    <div id="logs"></div>
  </aside>
  <section id="flowview" class="lg-view"></section>
  <section id="filesview" class="fl-view" hidden></section>
</div>
<script src="/ledger.js"></script>
<script src="/files.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
};

let source = null, current = null, logs = [];
const flow = window.HarnessLedger.create(document.getElementById("flowview"), $("stats"));
// Dosyalar görünümünde bir kayda "Akış'ta aç" denince defter o satırı seçer.
const filesView = window.HarnessFiles.create(document.getElementById("filesview"), {
  onOpenRecord: (id) => { showView("flow"); flow.focus(id); },
});

function showView(view) {
  const onFiles = view === "files" || view === "map";  // eski "map" bağlantıları da açılsın
  $("flowview").hidden = onFiles; $("filesview").hidden = !onFiles;
  $("tab-flow").classList.toggle("on", !onFiles); $("tab-files").classList.toggle("on", onFiles);
  const url = new URL(location.href); url.searchParams.set("view", onFiles ? "files" : "flow"); history.replaceState(null, "", url);
  if (onFiles) filesView.visible(); else flow.visible();
}
$("tab-flow").onclick = () => showView("flow");
$("tab-files").onclick = () => showView("files");

// Tercihler tarayıcıda saklanır; saklanamazsa (gizli pencere) yalnız bu sayfa boyunca geçerli.
const remember = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* yok say */ } };
const recall = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };

// ---- yan paneller: düzen haritası, ince şeritler, kısayollar
const panels = { sessions: true, side: true, ...recall("harness-panels", {}) };
function applyPanels() {
  document.body.classList.toggle("hide-sessions", !panels.sessions);
  document.body.classList.toggle("hide-side", !panels.side);
  $("toggle-sessions").setAttribute("aria-pressed", String(panels.sessions));
  $("toggle-side").setAttribute("aria-pressed", String(panels.side));
  $("toggle-focus").setAttribute("aria-pressed", String(!panels.sessions && !panels.side));
  remember("harness-panels", panels);
}
function togglePanel(name) {
  if (name === "focus") {
    const focused = !panels.sessions && !panels.side;
    panels.sessions = panels.side = focused;  // odaktaysa ikisini de geri aç
  } else panels[name] = !panels[name];
  applyPanels();
}
$("toggle-sessions").onclick = () => togglePanel("sessions");
$("toggle-side").onclick = () => togglePanel("side");
$("toggle-focus").onclick = () => togglePanel("focus");
// Kapalı panelin şeridine tıklamak onu açar (şerit, panelin kendisidir).
document.addEventListener("click", (e) => {
  if (!panels.sessions && e.target.closest(".layout > aside")) { togglePanel("sessions"); e.stopPropagation(); }
  else if (!panels.side && e.target.closest(".fl-side, .lg-inspector")) { togglePanel("side"); e.stopPropagation(); }
}, true);

// ---- renk temaları: TUI'deki paletler (cli/themes.py) + yalnız web'e özgü üç tema
const THEMES = {
  "sistem": { label: "Sistem", note: "işletim sisteminin açık/koyu tercihi" },
  "koyu": { label: "Koyu", note: "varsayılan koyu", dark: true, bg: "#0f1216", surface: "#171b20", surface2: "#222730",
            text: "#ebeff5", muted: "#9199a5", border: "#2a2e34", accent: "#6895f4", ok: "#5cc98a", warn: "#e0a83a",
            err: "#f07878", harness: "#c39bff" },
  "açık": { label: "Açık", note: "aydınlık ortam", dark: false, bg: "#fcfcfc", surface: "#ffffff", surface2: "#eef0f4",
            text: "#11161f", muted: "#6b727e", border: "#e3e5e7", accent: "#436ed1", ok: "#1f8a4c", warn: "#9a6400",
            err: "#c23b3b", harness: "#7a3fc4" },
  "gece": { label: "Gece mavisi", note: "derin lacivert, camgöbeği vurgu", dark: true, bg: "#0a0f1e", surface: "#111a2e",
            surface2: "#1a2542", text: "#dde6ff", muted: "#8693b8", border: "#25314f", accent: "#5ad1ff", ok: "#4fd1a1",
            warn: "#ffb454", err: "#ff6b8a", harness: "#b18cff" },
  "kağıt": { label: "Kâğıt", note: "sıcak, basılı sayfa gibi", dark: false, bg: "#f3ead6", surface: "#fbf6e9",
             surface2: "#eadfc4", text: "#3a2e1f", muted: "#7a6a52", border: "#d8cba8", accent: "#b0532c", ok: "#4f7a28",
             warn: "#a8701a", err: "#b23a3a", harness: "#7b4fa0" },
  "fosfor": { label: "Fosfor", note: "eski terminal ekranı", dark: true, bg: "#040904", surface: "#0a140a",
              surface2: "#122012", text: "#b9ffb0", muted: "#5fa65a", border: "#1d3a1d", accent: "#39ff14", ok: "#39ff14",
              warn: "#e6ff3a", err: "#ff5f56", harness: "#00e5ff" },
  "yüksek-kontrast": { label: "Yüksek kontrast", note: "en yüksek okunurluk", dark: true, bg: "#000000", surface: "#000000",
                       surface2: "#1a1a1a", text: "#ffffff", muted: "#d0d0d0", border: "#ffffff", accent: "#ffd400",
                       ok: "#00e676", warn: "#ffd400", err: "#ff5252", harness: "#40c4ff" },
  "renk-körü": { label: "Renk körü", note: "Okabe-Ito: mavi/turuncu ayrımı", dark: true, bg: "#0f1216", surface: "#171b20",
                 surface2: "#222730", text: "#ebeff5", muted: "#9199a5", border: "#2a2e34", accent: "#56b4e9",
                 ok: "#009e73", warn: "#e69f00", err: "#d55e00", harness: "#cc79a7" },
};
const VARS = { bg: "--bg", surface: "--surface", surface2: "--surface-2", text: "--text", muted: "--muted",
               border: "--border", accent: "--accent", ok: "--ok", warn: "--warn", err: "--err", harness: "--harness" };
let theme = THEMES[recall("harness-theme", "sistem")] ? recall("harness-theme", "sistem") : "sistem";

function applyTheme(name) {
  theme = name;
  const t = THEMES[name], root = document.documentElement;
  for (const [key, cssVar] of Object.entries(VARS)) {
    if (t.bg) root.style.setProperty(cssVar, t[key]); else root.style.removeProperty(cssVar);
  }
  if (t.bg) { root.dataset.theme = t.dark ? "dark" : "light"; root.style.colorScheme = t.dark ? "dark" : "light"; }
  else { delete root.dataset.theme; root.style.removeProperty("color-scheme"); }
  $("theme-name").textContent = t.label;
  remember("harness-theme", name);
  for (const card of $("theme-pop").children) card.classList.toggle("on", card.dataset.theme === name);
  // Oklar ve işaretler CSS değişkenlerinden boyanır: yeniden çizmeye gerek yok.
}

function themeCards() {
  const system = matchMedia("(prefers-color-scheme: dark)").matches ? THEMES["koyu"] : THEMES["açık"];
  $("theme-pop").replaceChildren(...Object.entries(THEMES).map(([name, t]) => {
    const c = t.bg ? t : system;
    const card = el("button", "theme-card" + (name === theme ? " on" : ""));
    card.dataset.theme = name;
    const prev = el("div", "theme-prev"); prev.style.background = c.bg;
    const rail = el("div", "tp-rail"); rail.style.background = c.surface2;
    const body = el("div", "tp-body"); body.style.background = c.surface; body.style.border = `1px solid ${c.border}`;
    for (const [w, color] of [["70%", c.text], ["45%", c.muted]]) {
      const line = el("i", "tp-line"); line.style.cssText = `display:block;width:${w};background:${color}`; body.append(line);
    }
    const dots = el("div", "tp-dots");
    for (const color of [c.accent, c.ok, c.warn, c.err, c.harness]) { const d = el("i"); d.style.background = color; dots.append(d); }
    body.append(dots); prev.append(rail, body);
    const meta = el("div", "theme-meta"); meta.append(el("b", "", t.label), el("span", "", t.note));
    card.append(prev, meta);
    card.onclick = () => { applyTheme(name); closeThemes(); };
    return card;
  }));
}
function closeThemes() { $("theme-pop").hidden = true; $("theme-btn").setAttribute("aria-expanded", "false"); }
$("theme-btn").onclick = (e) => {
  e.stopPropagation();
  const open = $("theme-pop").hidden;
  if (open) themeCards();
  $("theme-pop").hidden = !open; $("theme-btn").setAttribute("aria-expanded", String(open));
};
document.addEventListener("click", (e) => { if (!e.target.closest(".theme-wrap")) closeThemes(); });

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === "Escape") return closeThemes();
  if (e.key === "t" || e.key === "T") {  // TUI'deki Ctrl+T gibi: sıradaki tema
    const names = Object.keys(THEMES);
    e.preventDefault(); return applyTheme(names[(names.indexOf(theme) + 1) % names.length]);
  }
  const name = { "[": "sessions", "]": "side", f: "focus", F: "focus" }[e.key];
  if (name) { e.preventDefault(); togglePanel(name); }
});
applyPanels();
applyTheme(theme);
// Görünümler pencere boyunu üst çubuktan sonra kalan yere göre alır; çubuk satır kırarsa da doğru kalsın.
const header = document.querySelector("header");
const measureHeader = () => document.documentElement.style.setProperty("--head", header.offsetHeight + "px");
new ResizeObserver(measureHeader).observe(header);
measureHeader();

function open(path) {
  if (source) source.close();
  current = path; flow.reset(); filesView.reset(); drawLogs();
  const url = new URL(location.href); url.searchParams.set("path", path); history.replaceState(null, "", url);
  source = new EventSource("/api/stream?path=" + encodeURIComponent(path));
  source.onopen = () => $("dot").classList.add("live");
  source.onerror = () => $("dot").classList.remove("live");
  source.onmessage = (m) => {
    let event;
    try { event = JSON.parse(m.data); } catch (err) { console.error(err); return; }
    flow.append(event);
    filesView.append(event);
  };
}

function drawLogs() {
  document.querySelector(".layout > aside").dataset.count = `· ${logs.length}`;  // kapalı şeritte görünür
  $("logs").replaceChildren(...logs.map((log) => {
    const button = el("button", "log" + (log.path === current ? " on" : ""), log.task || "(boş kayıt)");
    button.append(el("small", "", new Date(log.modified * 1000).toLocaleString("tr-TR") + " · " + log.path));
    button.onclick = () => { $("follow").checked = false; open(log.path); };
    return button;
  }));
}

async function refresh() {
  try {
    logs = await (await fetch("/api/sessions")).json();
  } catch { return; }
  if (logs.length && (!current || ($("follow").checked && logs[0].path !== current))) open(logs[0].path);
  else drawLogs();
}

if (["files", "map"].includes(new URL(location.href).searchParams.get("view"))) showView("files");
const asked = new URL(location.href).searchParams.get("path");
if (asked) { $("follow").checked = false; open(asked); }
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
