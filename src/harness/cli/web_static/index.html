<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Harness</title>
<style>
  :root {
    --bg: #0f1216;
    --surface: #171b20;
    --border: #2a2e34;
    --text: #ebeff5;
    --muted: #9199a5;
    --primary: #6895f4;
    --danger: #e2585a;
    --ok: #3ecf8e;
    --ink-on-primary: #0b1020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, Consolas, monospace;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; color: var(--text); }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
  }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.18); }
  .dot.off { background: var(--danger); }
  header .sep { opacity: 0.5; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #log::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  #welcome {
    max-width: 56ch;
    margin: 56px auto 0;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
  }
  #welcome b { display: block; color: var(--text); font-size: 19px; margin-bottom: 10px; }
  #welcome .example {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  #welcome .example:hover {
    border-color: var(--primary);
    color: var(--primary);
    box-shadow: 0 2px 14px rgba(104, 149, 244, 0.15);
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    animation: fade-in 0.15s ease;
  }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    flex: 0 0 28px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    background: var(--border);
    color: var(--text);
  }
  .msg.user .avatar { background: var(--primary); color: var(--ink-on-primary); }
  .bubble {
    max-width: 65ch;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .msg.user .bubble { background: rgba(104, 149, 244, 0.12); border-color: rgba(104, 149, 244, 0.35); }
  .msg .role { color: var(--primary); font-weight: 600; margin-bottom: 4px; font-size: 12px; }
  .msg.user .role { color: var(--text); opacity: 0.7; text-align: right; }
  .msg .body { white-space: pre-wrap; line-height: 1.5; }
  .thought {
    color: var(--muted);
    font-style: italic;
    font-size: 12.5px;
    max-width: 70ch;
    margin: 6px 0 14px;
    padding: 8px 12px;
    border-left: 2px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
    border-radius: 0 8px 8px 0;
    white-space: pre-wrap;
    animation: fade-in 0.15s ease;
  }
  .tool {
    display: inline-block;
    color: var(--muted);
    margin: 6px 0;
    padding: 5px 10px;
    font-size: 12.5px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 6px;
    max-width: 100%;
    white-space: pre-wrap;
    word-break: break-word;
    animation: fade-in 0.15s ease;
  }
  .tool.error { color: var(--danger); background: rgba(226, 88, 90, 0.08); }
  .status { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .ask-box {
    display: none;
    margin: 10px 0;
    padding: 14px 16px;
    border: 1px solid var(--primary);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    animation: fade-in 0.15s ease;
  }
  .ask-box > div:first-child { margin-bottom: 10px; font-weight: 600; }
  .ask-box button {
    margin-top: 8px;
    margin-right: 8px;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .ask-box button:hover { border-color: var(--primary); color: var(--primary); background: rgba(104, 149, 244, 0.08); }
  .ask-box button.primary { border-color: var(--primary); color: var(--primary); }
  .ask-box button.primary:hover { background: var(--primary); color: var(--ink-on-primary); }
  .ask-box input[type="text"] {
    display: block;
    margin-top: 8px;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 13px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .ask-box input[type="text"]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(104, 149, 244, 0.15);
  }
  #composer {
    display: flex;
    gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #task {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #task:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(104, 149, 244, 0.15);
  }
  #send {
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: var(--ink-on-primary);
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  #send:hover:not(:disabled) { opacity: 0.88; }
  #send:active:not(:disabled) { transform: scale(0.97); }
  #send:disabled {
    opacity: 0.4;
    cursor: default;
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
  }
</style>
</head>
<body>
<header>
  <span class="brand"><span class="dot" id="dot"></span>HARNESS</span>
  <span class="sep">&middot;</span>
  <b id="conn">bağlanıyor…</b>
</header>
<div id="log">
  <div id="welcome">
    <b>Birlikte ne yapalım?</b>
    Aşağıya bir görev yaz; dosya okuma/yazma, arama ve komut çalıştırma gibi
    riskli adımlarda sana sorulur. Yanıtlar ve araç çağrıları burada akar.
    <div class="example" id="example">Bu proje hangi Python sürümünü istiyor, bağımlılıkları neler?</div>
  </div>
</div>
<div id="permission" class="ask-box"></div>
<div id="question" class="ask-box"></div>
<div id="composer">
  <input id="task" type="text" placeholder="Görevini yaz…" autocomplete="off" />
  <button id="send">Gönder</button>
</div>
<script>
const log = document.getElementById("log");
const welcome = document.getElementById("welcome");
const permissionBox = document.getElementById("permission");
const questionBox = document.getElementById("question");
const taskInput = document.getElementById("task");
const sendButton = document.getElementById("send");
const connStatus = document.getElementById("conn");
const connDot = document.getElementById("dot");

// Akan cevabın/düşüncenin o anki DOM düğümleri; model_replied'da sıfırlanır.
let currentReply = null;
let currentThought = null;

const proto = location.protocol === "https:" ? "wss:" : "ws:";
const ws = new WebSocket(`${proto}//${location.host}/ws`);

function hideWelcome() {
  if (welcome) welcome.remove();
}

function createMessage(role, cls) {
  hideWelcome();
  const div = document.createElement("div");
  div.className = "msg" + (cls ? " " + cls : "");
  const initial = role === "Sen" ? "S" : "A";
  div.innerHTML =
    `<div class="avatar">${initial}</div>` +
    `<div class="bubble"><div class="role">${role}</div><div class="body"></div></div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function appendToBody(div, text) {
  div.querySelector(".body").textContent += text;
  log.scrollTop = log.scrollHeight;
}

function addMessage(role, text, cls) {
  const div = createMessage(role, cls);
  appendToBody(div, text);
  return div;
}

function createThought() {
  hideWelcome();
  const div = document.createElement("div");
  div.className = "thought";
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function addNote(text, cls) {
  const div = document.createElement("div");
  div.className = "tool" + (cls ? " " + cls : "");
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function describeCall(call) {
  return `${call.name}(${call.arguments})`;
}

function askPermission(call) {
  permissionBox.style.display = "block";
  permissionBox.innerHTML = `<div>İzin isteniyor: ${describeCall(call)}</div>`;
  const choices = [
    ["deny", "Reddet", ""],
    ["always", "Oturum boyu izin ver", ""],
    ["allow", "İzin ver", "primary"],
  ];
  for (const [choice, label, cls] of choices) {
    const btn = document.createElement("button");
    btn.textContent = label;
    if (cls) btn.className = cls;
    btn.onclick = () => {
      ws.send(JSON.stringify({ choice }));
      permissionBox.style.display = "none";
      permissionBox.innerHTML = "";
    };
    permissionBox.appendChild(btn);
  }
}

function askQuestion(question, options) {
  questionBox.style.display = "block";
  questionBox.innerHTML = `<div>${question}</div>`;
  const sendAnswer = (answer) => {
    ws.send(JSON.stringify({ answer }));
    questionBox.style.display = "none";
    questionBox.innerHTML = "";
  };
  for (const option of options || []) {
    const btn = document.createElement("button");
    btn.textContent = option;
    btn.onclick = () => sendAnswer(option);
    questionBox.appendChild(btn);
  }
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "cevabını yaz… (boş bırakırsan model kendi varsayımıyla devam eder)";
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendAnswer(input.value);
  });
  questionBox.appendChild(input);
  const sendBtn = document.createElement("button");
  sendBtn.className = "primary";
  sendBtn.textContent = "Gönder";
  sendBtn.onclick = () => sendAnswer(input.value);
  questionBox.appendChild(sendBtn);
  input.focus();
}

ws.onopen = () => {
  connStatus.textContent = "bağlandı";
  connDot.className = "dot ok";
  sendButton.disabled = false;
};
ws.onclose = () => {
  connStatus.textContent = "bağlantı kesildi";
  connDot.className = "dot off";
  sendButton.disabled = true;
};

ws.onmessage = (raw) => {
  const event = JSON.parse(raw.data);
  switch (event.kind) {
    case "task_started":
      addMessage("Sen", event.task, "user");
      sendButton.disabled = true;
      break;
    case "model_text_delta":
      if (!currentReply) currentReply = createMessage("Ajan");
      appendToBody(currentReply, event.text);
      break;
    case "model_reasoning_delta":
      if (!currentThought) currentThought = createThought();
      currentThought.textContent += event.text;
      log.scrollTop = log.scrollHeight;
      break;
    case "model_replied":
      // Akış vermeyen adaptörde currentReply hiç kurulmamıştır; burada tek seferde eklenir.
      if (!currentReply && event.text) addMessage("Ajan", event.text);
      currentReply = null;
      currentThought = null;
      for (const call of event.tool_calls || []) {
        addNote(`→ araç isteği: ${describeCall(call)}`);
      }
      break;
    case "permission_requested":
      askPermission(event.call);
      break;
    case "question_asked":
      askQuestion(event.question, event.options);
      break;
    case "tool_started":
      addNote(`● ${event.call.name} çalışıyor…`);
      break;
    case "tool_finished": {
      const r = event.result;
      addNote(
        (r.is_error ? "! " : "✓ ") + event.call.name + ": " + r.content.slice(0, 300),
        r.is_error ? "error" : "",
      );
      break;
    }
    case "task_finished":
      addNote(`— tur bitti: ${event.reason} (${event.steps} adım) —`);
      sendButton.disabled = false;
      taskInput.focus();
      break;
    default:
      break;
  }
};

function submit() {
  const text = taskInput.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ task: text }));
  taskInput.value = "";
  sendButton.disabled = true;
}

sendButton.onclick = submit;
taskInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") submit();
});
document.getElementById("example").onclick = () => {
  taskInput.value = document.getElementById("example").textContent;
  submit();
};
sendButton.disabled = true;
taskInput.focus();
</script>
</body>
</html>
