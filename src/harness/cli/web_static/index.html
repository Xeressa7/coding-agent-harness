<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Harness</title>
<style>
  :root {
    --bg: #0f1216;
    --surface: #171b20;
    --border: #2a2e34;
    --text: #ebeff5;
    --muted: #9199a5;
    --primary: #6895f4;
    --danger: #e2585a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, Consolas, monospace;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
  }
  header b { color: var(--primary); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .msg { margin-bottom: 14px; max-width: 70ch; }
  .msg .role { color: var(--primary); font-weight: 600; margin-bottom: 2px; }
  .msg.user { border-left: 2px solid var(--primary); padding-left: 10px; }
  .tool { color: var(--muted); margin: 4px 0; font-size: 13px; }
  .tool.error { color: var(--danger); }
  .status { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #permission {
    display: none;
    margin: 8px 0;
    padding: 10px 12px;
    border: 1px solid var(--primary);
    border-radius: 6px;
    background: var(--surface);
  }
  #permission button {
    margin-top: 8px;
    margin-right: 8px;
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }
  #permission button.primary { border-color: var(--primary); color: var(--primary); }
  #composer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #task {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 14px;
  }
  #send {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--primary);
    background: transparent;
    color: var(--primary);
    cursor: pointer;
    font-family: inherit;
  }
  #send:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<header>HARNESS &middot; <b id="conn">bağlanıyor…</b></header>
<div id="log"></div>
<div id="permission"></div>
<div id="composer">
  <input id="task" type="text" placeholder="Görevini yaz…" autocomplete="off" />
  <button id="send">Gönder</button>
</div>
<script>
const log = document.getElementById("log");
const permissionBox = document.getElementById("permission");
const taskInput = document.getElementById("task");
const sendButton = document.getElementById("send");
const connStatus = document.getElementById("conn");

const proto = location.protocol === "https:" ? "wss:" : "ws:";
const ws = new WebSocket(`${proto}//${location.host}/ws`);

function addMessage(role, text, cls) {
  const div = document.createElement("div");
  div.className = "msg" + (cls ? " " + cls : "");
  div.innerHTML = `<div class="role">${role}</div><div></div>`;
  div.lastElementChild.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function addNote(text, cls) {
  const div = document.createElement("div");
  div.className = "tool" + (cls ? " " + cls : "");
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function describeCall(call) {
  return `${call.name}(${call.arguments})`;
}

function askPermission(call) {
  permissionBox.style.display = "block";
  permissionBox.innerHTML = `<div>İzin isteniyor: ${describeCall(call)}</div>`;
  const choices = [
    ["deny", "Reddet", ""],
    ["always", "Oturum boyu izin ver", ""],
    ["allow", "İzin ver", "primary"],
  ];
  for (const [choice, label, cls] of choices) {
    const btn = document.createElement("button");
    btn.textContent = label;
    if (cls) btn.className = cls;
    btn.onclick = () => {
      ws.send(JSON.stringify({ choice }));
      permissionBox.style.display = "none";
      permissionBox.innerHTML = "";
    };
    permissionBox.appendChild(btn);
  }
}

ws.onopen = () => {
  connStatus.textContent = "bağlandı";
  sendButton.disabled = false;
};
ws.onclose = () => {
  connStatus.textContent = "bağlantı kesildi";
  sendButton.disabled = true;
};

ws.onmessage = (raw) => {
  const event = JSON.parse(raw.data);
  switch (event.kind) {
    case "task_started":
      addMessage("Sen", event.task, "user");
      sendButton.disabled = true;
      break;
    case "model_replied":
      if (event.text) addMessage("Ajan", event.text);
      for (const call of event.tool_calls || []) {
        addNote(`→ araç isteği: ${describeCall(call)}`);
      }
      break;
    case "permission_requested":
      askPermission(event.call);
      break;
    case "tool_finished": {
      const r = event.result;
      addNote(
        (r.is_error ? "! " : "✓ ") + event.call.name + ": " + r.content.slice(0, 300),
        r.is_error ? "error" : "",
      );
      break;
    }
    case "task_finished":
      addNote(`— tur bitti: ${event.reason} (${event.steps} adım) —`);
      sendButton.disabled = false;
      taskInput.focus();
      break;
    default:
      break;
  }
};

function submit() {
  const text = taskInput.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ task: text }));
  taskInput.value = "";
  sendButton.disabled = true;
}

sendButton.onclick = submit;
taskInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") submit();
});
sendButton.disabled = true;
</script>
</body>
</html>
